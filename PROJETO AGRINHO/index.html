<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOCIAL PYETRA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111827;
    color:white;
}

header{
    background:linear-gradient(135deg,#b818e0,#8bd660);
    padding:25px;
    text-align:center;
}

header h1{
    font-size:40px;
}

header p{
    margin-top:10px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.novo-post{
    background:#383232;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

input[type=text],
textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:10px;
}

textarea{
    height:120px;
    resize:none;
}

input[type=file]{
    margin:10px 0;
}

button{
    background:#fdd90b;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#b4a0d3;
}

.post{
    background:#1f2937;
    margin-bottom:20px;
    border-radius:15px;
    overflow:hidden;
}

.post-header{
    padding:15px;
    background:#374151;
}

.post-header h3{
    margin-bottom:5px;
}

.post-conteudo{
    padding:15px;
}

.post img{
    width:100%;
    max-height:500px;
    object-fit:cover;
}

.acoes{
    padding:15px;
    border-top:1px solid #374151;
}

.like{
    cursor:pointer;
}

.comentarios{
    padding:15px;
}

.comentario{
    background:#374151;
    padding:10px;
    border-radius:8px;
    margin-top:8px;
}
</style>
</head>
<body>

<header>
<h1>® SOCIAL PYETRA</h1>
<p>Assinatura: Pyetra</p>
</header>

<div class="container">

<div class="novo-post">

<input type="text" id="nome" placeholder="Insira seu nome (opc)">

<textarea id="mensagem"
placeholder="escolha o que compartilhar"></textarea>

<input type="file" id="foto" accept="image/*">

<br><br>

<button onclick="publicar()">
Publicar Post
</button>

</div>

<div id="feed"></div>

</div>

<script>

function publicar(){

let nome =
document.getElementById("nome").value;

let mensagem =
document.getElementById("mensagem").value;

let foto =
document.getElementById("foto").files[0];

if(nome.trim() === ""){
    alert("Digite seu nome");
    return;
}

if(mensagem.trim() === "" && !foto){
    alert("Escreva algo ou envie uma foto");
    return;
}

let feed =
document.getElementById("feed");

let data =
new Date().toLocaleString("pt-BR");

let imagemHTML = "";

if(foto){
    let url =
    URL.createObjectURL(foto);

    imagemHTML =
    `<img src="${url}">`;
}

let post =
document.createElement("div");

post.className = "post";

post.innerHTML = `

<div class="post-header">
<h3>${nome}</h3>
<small>${data}</small>
</div>

<div class="post-conteudo">
<p>${mensagem}</p>
${imagemHTML}
</div>

<div class="acoes">
<span class="like"
onclick="curtir(this)">
❤️ Curtir (0)
</span>
</div>

<div class="comentarios">

<input type="text"
placeholder="Escreva um comentário">

<button onclick="comentar(this)">
Comentar
</button>

<div class="lista"></div>

</div>
`;

feed.prepend(post);

document.getElementById("nome").value="";
document.getElementById("mensagem").value="";
document.getElementById("foto").value="";
}

function curtir(el){

let texto = el.innerHTML;

let numero =
parseInt(texto.match(/\d+/)[0]);

numero++;

el.innerHTML =
`❤️ Curtir (${numero})`;
}

function comentar(botao){

let caixa =
botao.parentElement.querySelector("input");

if(caixa.value.trim() === ""){
    return;
}

let lista =
botao.parentElement.querySelector(".lista");

let div =
document.createElement("div");

div.className="comentario";

div.innerHTML =
caixa.value;

lista.appendChild(div);

caixa.value="";
}

</script>

</body>
</html>
